name: Build InVault Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg_dir: 外贸助理_交接包/外贸助理_windows_内测包
          - os: macos-latest
            pkg_dir: 外贸助理_交接包/外贸助理_mac_内测包
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location "${{ matrix.pkg_dir }}"
          ./scripts/build_windows_release.ps1 -Version "${{ steps.version.outputs.value }}" -SkipTests

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "${{ matrix.pkg_dir }}"
          chmod +x scripts/build_mac_release.sh
          SKIP_TESTS=1 ./scripts/build_mac_release.sh "${{ steps.version.outputs.value }}"

      - name: Harden mac beta package (App-only distribution)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.pkg_dir }}/release"
          ZIP="$(ls -1 TA_Beta_*_mac.zip | head -n 1)"
          if [ -z "${ZIP:-}" ]; then
            echo "No mac zip found in release/"
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$WORKDIR"
          STAGE_DIR="$(find "$WORKDIR" -maxdepth 1 -type d -name 'TA_Beta_*_mac' | head -n 1)"
          if [ -z "${STAGE_DIR:-}" ]; then
            echo "Unable to locate extracted stage dir"
            exit 1
          fi

          # Remove unsigned binary to avoid hard Gatekeeper block in beta phase.
          rm -f "$STAGE_DIR/InVault"

          # Ensure beta package keeps full runtime source payload.
          PKG_DIR="$(cd .. && pwd)"
          rm -rf "$STAGE_DIR/app" "$STAGE_DIR/config" "$STAGE_DIR/docs" "$STAGE_DIR/requirements.txt"
          cp -R "$PKG_DIR/app" "$STAGE_DIR/app"
          [ -d "$PKG_DIR/config" ] && cp -R "$PKG_DIR/config" "$STAGE_DIR/config"
          if [ ! -f "$STAGE_DIR/config/partner-policy.json" ]; then
            mkdir -p "$STAGE_DIR/config"
            cat > "$STAGE_DIR/config/partner-policy.json" <<'JSON'
          {
            "data_dir": "local_data",
            "knowledge_file": "knowledge_base.json",
            "output_dir": "artifacts",
            "state_board_file": "state_board.json",
            "user_settings_file": "user_settings.json"
          }
          JSON
          fi
          [ -d "$PKG_DIR/docs" ] && cp -R "$PKG_DIR/docs" "$STAGE_DIR/docs"
          [ -f "$PKG_DIR/requirements.txt" ] && cp "$PKG_DIR/requirements.txt" "$STAGE_DIR/requirements.txt"

          rm -f "$ZIP"
          (
            cd "$WORKDIR"
            zip -qr "$OLDPWD/$ZIP" "$(basename "$STAGE_DIR")"
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invault-${{ runner.os }}-${{ steps.version.outputs.value }}
          path: |
            ${{ matrix.pkg_dir }}/release/*.zip
            ${{ matrix.pkg_dir }}/release/*.dmg

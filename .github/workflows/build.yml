name: Build InVault Releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v1.0.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg_dir: 外贸助理_交接包/外贸助理_windows_内测包
          - os: macos-latest
            pkg_dir: 外贸助理_交接包/外贸助理_mac_内测包
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location "${{ matrix.pkg_dir }}"
          ./scripts/build_windows_release.ps1 -Version "${{ steps.version.outputs.value }}" -SkipTests

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd "${{ matrix.pkg_dir }}"
          chmod +x scripts/build_mac_release.sh
          SKIP_TESTS=1 ./scripts/build_mac_release.sh "${{ steps.version.outputs.value }}"

      - name: Harden mac beta package (Gatekeeper-safe launcher)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ matrix.pkg_dir }}/release"
          ZIP="$(ls -1 TA_Beta_*_mac.zip | head -n 1)"
          if [ -z "${ZIP:-}" ]; then
            echo "No mac zip found in release/"
            exit 1
          fi

          WORKDIR="$(mktemp -d)"
          unzip -q "$ZIP" -d "$WORKDIR"
          STAGE_DIR="$(find "$WORKDIR" -maxdepth 1 -type d -name 'TA_Beta_*_mac' | head -n 1)"
          if [ -z "${STAGE_DIR:-}" ]; then
            echo "Unable to locate extracted stage dir"
            exit 1
          fi

          # Remove unsigned binary to avoid hard Gatekeeper block in beta phase.
          rm -f "$STAGE_DIR/InVault"

          cat > "$STAGE_DIR/Launch_InVault_Mac.command" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"

          if command -v xattr >/dev/null 2>&1; then
            xattr -dr com.apple.quarantine "$SCRIPT_DIR" 2>/dev/null || true
          fi

          chmod +x "$SCRIPT_DIR"/*.command 2>/dev/null || true

          INSTALL_SCRIPT=""
          if [ -f "$SCRIPT_DIR/安装依赖_mac.command" ]; then
            INSTALL_SCRIPT="$SCRIPT_DIR/安装依赖_mac.command"
          elif [ -f "$SCRIPT_DIR/install_mac.command" ]; then
            INSTALL_SCRIPT="$SCRIPT_DIR/install_mac.command"
          fi

          READY_FLAG="$SCRIPT_DIR/.venv/.invault_ready_v1"
          if [ ! -f "$READY_FLAG" ] && [ -n "$INSTALL_SCRIPT" ]; then
            bash "$INSTALL_SCRIPT"
          fi

          if [ -x "$SCRIPT_DIR/.venv/bin/python" ]; then
            exec "$SCRIPT_DIR/.venv/bin/python" -m app.main desktop
          fi
          if command -v python3 >/dev/null 2>&1; then
            exec python3 -m app.main desktop
          fi
          echo "[ERROR] Python runtime not found."
          exit 1
          EOF

          chmod +x "$STAGE_DIR/Launch_InVault_Mac.command"
          chmod +x "$STAGE_DIR"/*.command 2>/dev/null || true

          rm -f "$ZIP"
          (
            cd "$WORKDIR"
            zip -qr "$OLDPWD/$ZIP" "$(basename "$STAGE_DIR")"
          )

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: invault-${{ runner.os }}-${{ steps.version.outputs.value }}
          path: |
            ${{ matrix.pkg_dir }}/release/*.zip
            ${{ matrix.pkg_dir }}/release/*.dmg

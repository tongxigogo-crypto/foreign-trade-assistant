name: deploy-website

on:
  workflow_dispatch:
  push:
    branches:
      - codex/product-manager
      - main
    paths:
      - ".github/workflows/deploy-website.yml"
      - "**/website/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          set -euo pipefail
          mkdir -p _site
          WEBSITE_DIR="$(find . -type d -path "*/website" | grep "windows" | head -n 1 || true)"
          if [ -z "${WEBSITE_DIR}" ]; then
            WEBSITE_DIR="$(find . -type d -path "*/website" | head -n 1 || true)"
          fi
          if [ -z "${WEBSITE_DIR}" ]; then
            echo "website directory not found"
            exit 1
          fi
          echo "Using website dir: ${WEBSITE_DIR}"
          cp -R "${WEBSITE_DIR}/." _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
